<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Ucapan untuk Mama & Papa</title>
    <link rel="stylesheet" text="text/css" href="style.css" />
</head>
<body>
    <!-- Kontainer Efek Hati -->
    <div class="hearts-container" id="hearts-container"></div>

    <div class="card-wrapper">
    <div class="card" id="card">
        <!-- Sisi Depan Kartu (Sampul) -->
        <div class="card-face card-front">
        <div class="front-content">
            <h1>Untuk Mama & Papa ❤️</h1>
            <p>Ketuk untuk membuka kartu</p>
            <button class="open-btn" id="openBtn">Buka Kartu</button>
        </div>
        </div>

        <!-- Sisi Belakang Kartu (Isi Ucapan) -->
        <div class="card-face card-back">
        <div class="back-content">
            <div class="judul">
                <h2>Terima Kasih, Mama & Papa</h2>
            </div>
            <div class="message" id="hidden-message">
                <p></p>
            </div>
            <div class="signature">
                <p class="dari">From : Kevvin Hariska Wijaya</p>
            </div>
            <div class="tombol">
                <button class="close-btn" id="closeBtn">Tutup Kembali</button>
            </div>
        </div>
        </div>
    </div>
    </div>

    <script>
    const teksPesan =
        "Terima kasih atas semua kasih sayang, kesabaran, dan pengorbanan yang tiada henti. Mama dan Papa adalah rumah terbaik tempat aku pulang, sumber kekuatan, dan inspirasi dalam hidupku. Semoga Mama dan Papa selalu diberikan kesehatan, kebahagiaan, dan umur panjang. Aku sangat menyayangi kalian berdua!";
    const elemenePesan = document.querySelector(".message");
    let index2 = 0;

    function ketikPesan() {
        if (index2 < teksPesan.length) {
        elemenePesan.textContent += teksPesan.charAt(index2);
        index2++;
        setTimeout(ketikPesan, 70);
        }
    }
    window.onload = ketikPesan;
    </script>

    <script src="script.js"></script>
</body>
</html>
